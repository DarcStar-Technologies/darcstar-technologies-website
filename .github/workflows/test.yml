name: test

# Run the full local test suite in CI (DAR-49): the three vitest projects (client / server /
# storybook — client + storybook drive real chromium via vitest browser mode) and the Playwright
# e2e suite, whose webServer builds the Cloudflare bundle and previews it on the real Workers
# runtime (wrangler dev). No real credentials exist in CI: the unit job runs with no env at all,
# and the e2e job runs against committed placeholder values (below) — the e2e specs are written
# DB-free, and a Sanity-token-less preview degrades to empty content lists, which the specs
# tolerate (the same resilience posture the routes ship with).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The client + storybook projects run in real chromium (vitest browser mode);
      # --with-deps also installs the runner's system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # No `--` before --run: pnpm forwards a literal `--` and what lands past it is dropped.
      # Measured on pnpm 11.13 / vitest 4.1: `--run` itself DOES survive, but a positional filter
      # does not — `pnpm test:unit -- --run <path>` runs the whole suite while looking like it ran
      # the one file. Harmless for this job (it wants the whole suite anyway) and load-bearing
      # locally, which is why docs/commands.md carries the same warning.
      - run: pnpm test:unit --run
      # A red unit run writes a structured record of every failure to test-failures/ (DAR-90). The
      # job log has the same names, but not the runner's load average or how long the rest of the
      # suite took — and on a shared runner, "was the box busy" is the question a one-off red raises
      # and the log cannot answer.
      - name: Upload unit failure report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-failure-report
          path: test-failures/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The preview worker needs env PRESENT to construct its DB/auth clients (getDb() / Better
      # Auth throw when the vars are ABSENT), but the e2e specs are DB-free by design —
      # placeholder values satisfy construction without any real credentials, and the one load
      # that queries (/waitlist interest suggestions) degrades to its curated seed. Only the signing
      # secret is written here; the rest of that env is baked as `--var`s by the suite itself.
      # NEITHER ORIGIN NOR DATABASE_* IS WRITTEN HERE ANY MORE, and for one reason twice over: a value
      # hand-written into this file is a value only CI has. ORIGIN was localhost:4173 here, so CI was
      # the only place the auth API was reachable — a local run, whose .env holds the dev server's
      # origin, silently tested a /api/auth that 404'd (DAR-81). DATABASE_URL was a placeholder host
      # here, so CI was the only run that was hermetic — a local run wrote to the developer's real dev
      # database, and never saw the workerd DNS/uncaught-error noise that made a CI e2e log unreadable
      # (DAR-85). Both now come from one derivation the suite applies wherever it runs:
      # scripts/preview-vars.mjs, via scripts/preview.mjs and playwright.config.ts.
      - name: Provide placeholder runtime env (specs never touch a real DB)
        run: echo 'BETTER_AUTH_SECRET=e2e-placeholder-not-a-secret' > .env
      # Not `pnpm test:e2e` — the runner additionally needs --with-deps for chromium's system
      # libraries, and this skips the script's own (then-redundant) install step.
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright's webServer runs `pnpm build && pnpm preview` (the real wrangler dev runtime,
      # with the always-pass Turnstile test keys baked in — see scripts/preview.mjs, where DAR-79
      # moved them from package.json).
      - run: pnpm exec playwright test
      # A red e2e without artifacts is undebuggable — keep the traces (captured on first retry,
      # see playwright.config.ts) and any screenshots/output from the failing run.
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
